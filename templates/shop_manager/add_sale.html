{% load static %}

<!doctype html>
<html lang="en" class="h-full bg-gray-50">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add New Sale</title>
    <!-- Tailwind CSS CDN (dev only – replace with build in production) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Select2 CSS + JS CDN for searchable dropdowns -->
    <link
      href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css"
      rel="stylesheet"
    />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#1d4ed8",
              success: "#16a34a",
            },
          },
        },
      };
    </script>
  </head>

  <body class="h-full">
    <div class="min-h-full flex flex-col">
      <!-- Header Bar -->
      <div class="bg-primary text-white py-4 px-8 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
          <h1 class="text-2xl font-bold">Add New Sale</h1>
          <div class="space-x-4">
            <a
              href="{% url 'admin:shop_manager_sale_changelist' %}"
              class="bg-gray-700 hover:bg-gray-800 text-white font-medium py-2 px-6 rounded-md transition"
            >
              Back to List
            </a>
            <a
              href="{% url 'admin:shop_manager_sale_changelist' %}"
              class="bg-red-600 hover:bg-red-700 text-white font-medium py-2 px-6 rounded-md transition"
            >
              Cancel
            </a>
          </div>
        </div>
      </div>

      <!-- Main Form -->
      <div
        class="flex-grow flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8"
      >
        <div class="max-w-6xl w-full bg-white p-10 rounded-xl shadow-lg">
          <form id="saleForm" class="space-y-10">
            {% csrf_token %}

            <!-- Sale Details -->
            <div class="border-b border-gray-200 pb-8">
              <h2 class="text-2xl font-semibold text-gray-800 mb-6">
                Sale Details
              </h2>
              <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                <!-- Sale Date -->
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">
                    Sale Date *
                  </label>
                  <input
                    type="date"
                    id="sale_date"
                    value="{% now 'Y-m-d' %}"
                    required
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary h-11 px-3 border"
                  />
                </div>

                <!-- Payment Status -->
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">
                    Payment Status *
                  </label>
                  <select
                    id="payment_status"
                    required
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary h-11 px-3 border"
                  >
                    <option value="">-- Select status --</option>
                    <option value="Paid">Paid</option>
                    <option value="Unpaid">Unpaid</option>
                    <option value="Partial">Partial</option>
                    <option value="Pending">Pending</option>
                  </select>
                </div>

                <!-- Payment Method -->
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">
                    Payment Method *
                  </label>
                  <select
                    id="payment_method"
                    required
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary h-11 px-3 border"
                  >
                    <option value="">-- Select method --</option>
                    <option value="Cash">Cash</option>
                    <option value="Card">Card</option>
                    <option value="M-Pesa">M-Pesa</option>
                    <option value="Bank Transfer">Bank Transfer</option>
                  </select>
                </div>

                <!-- Discount -->
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">
                    Discount (KES)
                  </label>
                  <input
                    type="number"
                    id="discount"
                    value="0"
                    min="0"
                    step="0.01"
                    class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-primary focus:ring-primary h-11 px-3 border"
                  />
                </div>
              </div>
            </div>

            <!-- Sale Items -->
            <div>
              <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-semibold text-gray-800">Sale Items</h2>
                <button
                  type="button"
                  id="addItemBtn"
                  class="bg-primary hover:bg-blue-700 text-white font-medium py-2 px-5 rounded-md transition shadow-sm"
                >
                  + Add Item
                </button>
              </div>

              <div class="overflow-x-auto border border-gray-200 rounded-lg">
                <table class="w-full min-w-max">
                  <thead class="bg-gray-50 text-gray-700 font-medium text-left">
                    <tr>
                      <th class="px-6 py-4">#</th>
                      <th class="px-6 py-4 w-96">Product</th>
                      <th class="px-6 py-4 text-right">Quantity</th>
                      <th class="px-6 py-4 text-right">Unit Price (KES)</th>
                      <th class="px-6 py-4 text-right">Subtotal (KES)</th>
                      <th class="px-6 py-4"></th>
                    </tr>
                  </thead>
                  <tbody
                    id="itemsBody"
                    class="divide-y divide-gray-200"
                  ></tbody>
                  <tfoot class="bg-gray-50 font-bold text-lg">
                    <tr>
                      <td colspan="4" class="px-6 py-4 text-right">
                        Grand Total (KES):
                      </td>
                      <td
                        id="grandTotal"
                        class="px-6 py-4 text-right text-success"
                      >
                        0.00
                      </td>
                      <td></td>
                    </tr>
                  </tfoot>
                </table>
              </div>

              <div class="mt-8 flex justify-end">
                <button
                  type="submit"
                  class="bg-success hover:bg-green-700 text-white font-semibold py-3 px-10 rounded-lg transition shadow-lg text-lg"
                >
                  Create Sale
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Product Data (safe JSON) -->
    <script id="products-data" type="application/json">
      {{ products_json|safe }}
    </script>

    <script>
      // Load product data safely
      const productsDataElement = document.getElementById("products-data");
      const productsData = productsDataElement
        ? JSON.parse(productsDataElement.textContent)
        : [];
      window.productOptions = productsData.map((p) => ({
        id: p.id,
        text: `${p.name} (Stock: ${p.stock_qty ?? 0})`,
        price: parseFloat(p.selling_price) || 0,
        stock: parseInt(p.stock_qty) || 0,
      }));

      let rowCounter = 0;

      function calculateRowTotal(row) {
        const quantityInput = row.querySelector(".quantity");
        const unitPriceInput = row.querySelector(".unit-price");
        const totalCell = row.querySelector(".item-total");

        if (!quantityInput || !unitPriceInput || !totalCell) return 0;

        const qty = parseFloat(quantityInput.value) || 0;
        const price = parseFloat(unitPriceInput.value) || 0;
        const total = qty * price;
        totalCell.textContent = total.toFixed(2);
        return total;
      }

      function calculateTotals() {
        let subtotal = 0;
        document.querySelectorAll("#itemsBody tr").forEach((row) => {
          subtotal += calculateRowTotal(row);
        });
        const discount =
          parseFloat(document.getElementById("discount").value) || 0;
        const grand = subtotal - discount;
        document.getElementById("grandTotal").textContent = grand.toFixed(2);
      }

      function addItemRow() {
        rowCounter++;
        const tbody = document.getElementById("itemsBody");
        const row = document.createElement("tr");
        row.dataset.rowId = rowCounter;

        row.innerHTML = `
            <td class="px-4 py-3 text-center">
              <button type="button" class="removeRow text-red-600 hover:text-red-800 font-bold text-xl">&times;</button>
            </td>
            <td class="px-4 py-3">
              <select class="product-select w-full h-11 px-3 border rounded-md" required></select>
            </td>
            <td class="px-4 py-3">
              <input type="number" class="quantity w-full h-11 px-3 border rounded-md" min="1" value="1" required>
            </td>
            <td class="px-4 py-3">
              <input type="number" class="unit-price w-full h-11 px-3 border rounded-md" step="0.01" min="0" required>
            </td>
            <td class="px-4 py-3 text-right item-total font-medium">0.00</td>
          `;

        tbody.appendChild(row);

        // Initialize Select2
        const select = row.querySelector(".product-select");
        $(select).select2({
          data: window.productOptions,
          placeholder: "Search for a product...",
          allowClear: true,
          width: "100%",
        });

        // On product select: auto-fill price
        $(select).on("change", function () {
          const selected = window.productOptions.find(
            (opt) => opt.id === this.value,
          );
          const priceInput = row.querySelector(".unit-price");
          if (selected && priceInput) {
            priceInput.value = selected.price.toFixed(2);
          } else if (priceInput) {
            priceInput.value = "";
          }
          calculateRowTotal(row);
          calculateTotals();
        });

        // Quantity or price change
        row.querySelectorAll(".quantity, .unit-price").forEach((input) => {
          input.addEventListener("input", () => {
            calculateRowTotal(row);
            calculateTotals();
          });
        });

        // Remove row
        row.querySelector(".removeRow").addEventListener("click", () => {
          $(select).select2("destroy");
          row.remove();
          calculateTotals();
        });

        calculateTotals();
      }

      // Discount change
      document
        .getElementById("discount")
        .addEventListener("input", calculateTotals);

      // Add first row on load
      document
        .getElementById("addItemBtn")
        .addEventListener("click", addItemRow);
      addItemRow();

      // Form Submit
      document
        .getElementById("saleForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const items = [];
          let hasError = false;

          document.querySelectorAll("#itemsBody tr").forEach((row) => {
            const productSelect = row.querySelector(".product-select");
            const quantityInput = row.querySelector(".quantity");
            const unitPriceInput = row.querySelector(".unit-price");

            if (!productSelect || !quantityInput || !unitPriceInput) {
              console.warn("Skipping malformed row");
              return;
            }

            const product = productSelect.value.trim();
            const quantity = parseInt(quantityInput.value) || 0;
            const unit_price = parseFloat(unitPriceInput.value) || 0;

            if (product && quantity > 0 && unit_price > 0) {
              const selectedOption = window.productOptions.find(
                (opt) => opt.id === product,
              );
              if (!selectedOption) {
                alert("Product not found in available options.");
                hasError = true;
                return;
              }

              if (quantity > selectedOption.stock) {
                alert(
                  `Quantity for "${selectedOption.text}" exceeds available stock (${selectedOption.stock}).`,
                );
                hasError = true;
                return;
              }

              items.push({
                product: product,
                quantity: quantity,
                unit_selling_price: unit_price,
              });
            }
          });

          if (hasError) return;
          if (items.length === 0) {
            alert("Please add at least one item.");
            return;
          }

          const formData = {
            sale_date: document.getElementById("sale_date").value,
            payment_status: document.getElementById("payment_status").value,
            payment_method: document.getElementById("payment_method").value,
            discount:
              parseFloat(document.getElementById("discount").value) || 0,
            items: items,
          };

          try {
            const response = await fetch("{{ api_url }}", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "X-CSRFToken": "{{ csrf_token }}",
              },
              credentials: "include",
              body: JSON.stringify(formData),
            });

            if (response.ok) {
              alert("Sale created successfully!");
              window.location.href =
                '{% url "admin:shop_manager_sale_changelist" %}';
            } else {
              const error = await response.json();
              alert("Error: " + JSON.stringify(error));
            }
          } catch (err) {
            alert("Network error: " + err.message);
          }
        });
    </script>
  </body>
</html>
